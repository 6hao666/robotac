field_yaw: 1.5708   # 起飞时机头朝场地+y（π/2 rad），2026-08-27 实测
# robotac_mission 参数模板（骨架轮）。
# 说明：
# - 数值为占位值：规则几何值（场地/圆桌/障碍，来自 2026-8-12 C 组规则）可直接参考，
#   其余阈值（超时/速度/高度）为安全占位，标注“待实机验证”的字段须由实机负责人
#   经地面与飞行验证后回填。
# - 不包含借用新机 IP、序列号、设备别名、外参（交接文档红线）。
# - mission.dry_run=true 时 interfaces 不发送任何控制；本轮固定 true。

frames:
  mission_frame: map
  body_frame: base_link

limits:
  field_min: [0.0, 0.0, 0.0]     # 有效飞行区下界（规则几何，待 map 原点标定校准）
  field_max: [4.0, 5.0, 3.0]     # 有效飞行区上界 4.00m x 5.00m x 3.00m
  field_tolerance: 0.1           # 边界容差 m（2026-08-23：防 map_to_field 浮点误差误报越界）
  max_speed: 0.2                 # 待实机验证（2026-08-23 降速：FAST-LIO 运动时地图不稳，慢速让地图跟上）

obstacle:                        # 固定障碍（规则几何，参考值）
  center: [2.00, 2.50]           # 场地中部；结合 2.10m 长度与两侧 0.95m 净宽确定
  size: [2.10, 0.15, 2.00]       # 长 x 宽 x 高 m
  cross_gap: 0.95                # 两侧净宽 m
  route_clearance: 0.20          # 机体外廓、定位误差和控制超调的最小合并裕量；实机复核后才可缩小
  no_overfly: true               # 禁止从顶部越过

tables:                          # 两桌同 Tag 判别依据（规则几何参考值）
  takeoff_center: [2.00, 0.80]   # 起降台圆心（场地坐标，待映射到 map）
  delivery_center: [2.00, 4.20]  # 投放台圆心
  height: 0.75                   # 桌面高 m
  search_radius: 1.0             # 预期桌区匹配半径，待实机验证

timing:
  pose_timeout: 0.5              # 本地位姿数据年龄上限 s
  tag_timeout: 1.0               # Tag 数据年龄上限 s
  topic_timeout:                 # 各启动门话题数据年龄上限 s，待实机验证
    fcu_state: 2.0               # /mavros/state（MAVROS 低频）
    extended_state: 2.0          # /mavros/extended_state（低频）
    estimator_status: 3.0        # /mavros/estimator_status（交接实测 ~1Hz，阈值须 ≥2-3× 周期防抖动误报）
    timesync_status: 2.0         # /mavros/timesync_status（低频）
    vision_healthy: 1.0          # /vision_pose_bridge/healthy
    vision_state: 2.0            # /vision_pose_bridge/state（fake 周期 0.5s）
  max_rtt_ms: 50.0               # timesync 往返时延上限 ms（实测约 1.78ms，留裕量）
  total_window: 360.0            # 两次飞行共享连续 6 分钟（规则硬性）
  flight_budget: 150.0           # 单次飞行预算 s，待实机验证
  takeoff_hold: 3.0              # C1 起飞稳定保持 >=3s（规则硬性）
  align_hold: 3.0                # C3 对准悬停稳定保持 >=3s（规则硬性）
  waypoint_hold: 1.0             # 绕障/返航每航点稳定保持 s，待实机验证
  release_hold: 1.0              # 释放后等待货物脱离的保持 s，待实机验证
  land_confirm: 30.0             # AUTO.LAND 等待落地确认 s（示例 06 模式）
  stage_timeout:                 # 各阶段超时 s，待实机验证
    takeoff: 20.0
    transit: 30.0
    search: 30.0
    align: 20.0
    release: 10.0
    return: 30.0
    land: 20.0

landing:                         # AUTO.LAND 握手与落地事实确认（安全关键）
  mode_retry_seconds: 1.0        # 未见 FCU 实际进入 AUTO.LAND 前的模式请求间隔
  mode_retry_count: 3            # 有限重试；耗尽后保持 setpoint 并要求人工接管
  confirm_samples: 3             # 请求之后连续的新鲜 ON_GROUND 样本数
  max_height: 0.25               # field z 不得高于此值（允许落到地面时为负的现有高度口径）
  max_vertical_speed: 0.10       # m/s，落地确认时须基本静止
  velocity_timeout: 0.5          # /mavros/local_position/velocity_local 数据年龄上限 s

control:                         # 飞行控制策略（占位，随 07/09/10 回填；示例源码值）
  rate_hz: 20.0                  # setpoint 流频率（示例默认 20Hz）
  position_tolerance: 0.15       # 到达/对准收敛容差 m（示例默认 0.15）
  max_step: 0.20                 # ALIGN 单帧最大水平位移 m（示例 10 默认 0.20）
  prestream_seconds: 2.0         # OFFBOARD 前 setpoint 预流时长 s（示例 begin 2.0）
  health_debounce: 5             # 瞬态门连续次数（06 修复去抖，默认 5）
  tag_jump_limit: 0.15           # Tag 稳定过滤跳变上限 m（示例 StableTag 0.15）
  pose_jump_limit: 1.0           # 相邻位姿跳变告警上限 m（预留守卫）

tag:
  family: tag36h11
  id: 0
  black_size_m: 0.15             # 黑色编码区边长 m
  stable_time: 1.0               # 连续稳定时间 s，待实机验证
  stable_samples: 5              # 多样本均值窗口（示例 StableTag 5 样本），待实机验证

waypoints:                       # 名义航点骨架（规则几何参考，map 原点标定后校准）
  # 桌上方航点（takeoff/mission/return）z 须 ≥ 桌面高 0.75（config 校验）；
  # C1 起飞稳定保持须 1.0-2.0m，占位取 1.0。绕障航点位于场地中段侧隙、不在桌上。
  takeoff: [2.0, 0.80, 0.75]      # 起降台上方（C1 保持高度，> 桌面 0.75）
  # 障碍物横跨场地中部：x=[0.95, 3.05]、y=[2.425, 2.575]。
  # 左侧侧隙 x=[0, 0.95]；x=0.475 是该侧隙中心，去返程均从此绕行。
  obstacle_routing:
    approach: [0.475, 1.75, 0.8]
    gap_enter: [0.475, 2.30, 0.8]
    gap_cross: [0.475, 2.70, 0.8]
    resume: [0.475, 3.25, 0.8]
  mission: [[2.0, 4.20, 0.75]]    # 投放台正上方（> 桌面 0.75，便于识别 Tag/投放）
  return_routing:                # 返程：沿同一左侧通道反向绕障
    approach: [0.475, 3.25, 0.8]
    gap_enter: [0.475, 2.70, 0.8]
    gap_cross: [0.475, 2.30, 0.8]
    resume: [0.475, 1.75, 0.8]
  return: [[2.0, 0.80, 0.75]]     # 起降台上方（> 桌面 0.75）

payload:
  enable: false                  # 本轮固定 false
  retry_count: 0
  offset: [-0.04, 0.0, -0.09]    # 舵机相对 body 偏移 [x,y,z]（2026-08-26 实测：机尾 4cm、机下 9cm、中轴线 y=0）

mission:
  dry_run: false                 # true=interfaces 不发送任何控制（G1/拆桨联调）；真飞必须 false
  flight_enabled: true           # true=start 进入 TAKEOFF 触发飞行态（真飞/拆桨联调）；false=骨架占位
  route_only: true             # 临时空载：投放点不驱动舵机，直接返航
