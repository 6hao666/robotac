# Robotac 教学示例实际启用的 MAVROS 参数。
startup_px4_usb_quirk: false

conn:
  heartbeat_rate: 1.0
  timeout: 10.0
  timesync_rate: 10.0
  system_time_rate: 1.0

sys:
  min_voltage: 10.0
  disable_diag: false

time:
  time_ref_source: fcu
  timesync_mode: MAVLINK
  timesync_avg_alpha: 0.6

cmd:
  use_comp_id_system_control: false

imu:
  frame_id: base_link
  linear_acceleration_stdev: 0.0003
  angular_velocity_stdev: 0.0003490659
  orientation_stdev: 1.0
  magnetic_stdev: 0.0

local_position:
  frame_id: map
  tf:
    send: false
    frame_id: map
    child_frame_id: base_link
    send_fcu: false

setpoint_position:
  tf:
    listen: false
    frame_id: map
    child_frame_id: target_position
    rate_limit: 50.0
  mav_frame: LOCAL_NED

vision_pose:
  tf:
    listen: false
    frame_id: odom
    child_frame_id: vision_estimate
    rate_limit: 10.0
