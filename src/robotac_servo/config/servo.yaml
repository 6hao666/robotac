# 启动时只连接串口，不发送任何舵机动作。
port: /dev/robotac_servo
port_candidates:
  - /dev/robotac_servo
baudrate: 115200

channel: 1
frequency_hz: 50
pwm_min_duty: 3
pwm_max_duty: 12
min_command_angle: 0.0
max_command_angle: 70.0
blocked_angle: 0.0
released_angle: 45.0

# 动作完成后发送 0% 占空比，避免持续堵转。
drive_seconds: 0.30
idle_after_move: true
idle_duty: 0
allow_repeat: false
