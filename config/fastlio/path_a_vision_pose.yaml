path_a_vision_pose:
  # Sunray Path A data path:
  #   /sunray/odometry -> geometry_msgs/PoseStamped -> /mavros/vision_pose/pose
  # MAVROS output is still opt-in from launch and requires this approval flag.
  frame_alignment_approved: true
  input_topic: /sunray/odometry
  output_topic: /mavros/vision_pose/pose
  preview_topic: /robotac/fastlio_vision/path_a_pose_preview
  health_topic: /robotac/fastlio_vision/healthy
  status_topic: /robotac/fastlio_vision/status
  output_enabled_topic: /robotac/fastlio_vision/output_enabled

  # Sunray's transform_odom_pointCloud publishes /sunray/odometry in world.
  # MAVROS vision_pose is configured for an odom-style external-vision frame,
  # so the outgoing PoseStamped frame is normalized to odom by default while
  # preserving the FAST-LIO/Sunray timestamp and pose values.
  output_frame_id: odom
  preserve_input_frame: false
  strict_input_frames: false
  expected_input_parent: world
  expected_input_child: ""

  # /sunray/odometry is already relative to the first FAST-LIO pose; keep it
  # unchanged unless field evidence shows an additional local origin reset is
  # needed for the installed airframe.
  zero_origin_on_start: false
  max_age: 0.30
  max_future: 0.10
  min_rate_hz: 5.0
  min_samples: 5
  health_timeout: 0.50
  max_position_speed: 8.0
  max_yaw_rate: 6.0
  max_output_radius: 50.0
