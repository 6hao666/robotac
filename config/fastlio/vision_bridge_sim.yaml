# Used only by the isolated FAST-LIO-to-MAVROS bridge regression. Never copy
# this approval flag into the aircraft deployment configuration.
fastlio_vision_bridge:
  frame_alignment_approved: true
  expected_input_parent: camera_init
  expected_input_child: body
  output_parent_frame: odom
  strict_input_frames: true
  max_age: 0.30
  max_future: 0.10
  health_timeout: 0.50
  min_rate_hz: 5.0
  min_samples: 3
  max_position_speed: 8.0
  max_yaw_rate: 6.0
  zero_origin_on_start: false
  max_output_radius: 100.0
  # Deliberately non-identity bench transforms. The integration test verifies
  # world/airframe rotation, translation, lever-arm covariance, and quaternion
  # composition; these values must never be copied into deployment.yaml.
  input_world_to_output_quaternion: [0.0, 0.0, 0.7071067811865475, 0.7071067811865476]
  input_world_to_output_translation: [1.0, -2.0, 0.5]
  input_child_to_output_child_quaternion: [0.0, 0.0, -0.3826834323650898, 0.9238795325112867]
  input_child_to_output_child_translation: [0.3, -0.2, 0.1]
  default_position_variance: 0.04
  default_angle_variance: 0.03
