# Position-only runtime route for /robotac/flight/waypoints.
# The PoseArray API carries x/y/z/yaw only. Use local_waypoints.yaml for full
# mission metadata such as per-waypoint hold times and payload actions.
waypoint_frame: robotac_start_body
waypoints:
  - {x: 1.0, y: 0.0, z: 1.0, yaw_deg: 0.0}
  - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0}
  - {x: 0.0, y: 1.0, z: 1.0, yaw_deg: 0.0}
  - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0}
  - {x: 0.0, y: -1.0, z: 1.0, yaw_deg: 0.0}
  - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0}
