tag_payload_mission:
  # Mission frame captured at /robotac/tag_payload_mission/start:
  #   +x = aircraft nose/front
  #   +y = aircraft right
  #   +z = up
  takeoff_height: 0.30
  tag_overfly_height: 0.30

  first_point:        {x: 2.0, y: 2.0, z: 0.30, yaw_deg: 0.0}
  drop_scan_point:    {x: 4.0, y: 0.0, z: 0.80, yaw_deg: 0.0}
  return_first_point: {x: 2.0, y: 2.0, z: 0.30, yaw_deg: 0.0}
  home_point:         {x: 0.0, y: 0.0, z: 0.30, yaw_deg: 0.0}

  # After reaching the 4m/0m/0.8m point, wait for attitude/position to settle
  # before accepting the payload-area tag.
  drop_stabilize_seconds: 2.0

  # User request said “等待 1m”; this is treated as a configurable 1 second
  # wait above the confirmed drop tag before opening the servo.
  payload_wait_seconds: 1.0
  payload_settle_seconds: 1.0

  # AprilTag semantics.
  drop_tag_id: 1
  land_tag_id: 0
  tag_stable_samples: 15
  tag_jump_threshold: 0.05
  tag_max_age: 0.50
  tag_scan_timeout: 45.0
  # Empty means use the current MAVROS local odometry frame. Usually this is map.
  tag_target_frame: ""
  tf_timeout: 0.15

  # Flight control tolerances and timings.
  position_tolerance: 0.18
  yaw_tolerance_deg: 12.0
  hold_seconds: 1.0
  prestream_seconds: 5.0
  offboard_timeout: 15.0
  arming_timeout: 15.0
  takeoff_timeout: 45.0
  segment_timeout: 60.0
  mission_timeout: 600.0
  local_pose_timeout: 0.50
  # MAVROS /state is commonly about 1 Hz on the aircraft. Keep this comfortably
  # above one period so normal scheduler jitter does not abort the mission
  # before OFFBOARD/arming requests are sent.
  state_timeout: 3.0
  extended_state_timeout: 1.0
  max_local_position_speed: 8.0

  # Landing handoff.
  auto_land_required: true
  land_mode: AUTO.LAND
  land_switch_height: 0.30
  land_descent_rate: 0.25
  landing_timeout: 60.0
  abort_action: release
