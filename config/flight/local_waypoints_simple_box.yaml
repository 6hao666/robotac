local_waypoint_flight:
  # Full mission route-file example for local MAVROS flight tests.
  # Coordinates are FLU offsets relative to the aircraft heading captured by
  # /robotac/flight/start: x forward, y left, z up. No GPS/global coordinates.
  waypoint_frame: robotac_start_body
  takeoff_height: 1.0
  require_auto_land: true
  waypoints:
    - {x: 1.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 1.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: -1.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: -1.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
  position_tolerance: 0.25
  yaw_tolerance_deg: 12.0
  waypoint_timeout: 45.0
  mission_timeout: 600.0
  control_rate_hz: 20.0
  prestream_seconds: 5.0
  require_vision: true
  require_vision_output: true
  require_estimator_status: true
  require_horizontal_relative: true
  require_vertical_estimate: true
  require_vision_output_consumer: true
  require_setpoint_consumer: true
  require_timesync: true
  land_mode: AUTO.LAND
  land_descent_rate: 0.30
  land_switch_height: 0.50
