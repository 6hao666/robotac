local_waypoint_flight:
  # x/y/z are FLU offsets relative to the aircraft heading captured by start:
  # x forward, y left, z up. The controller converts them to local ENU before
  # publishing to MAVROS. No global/GPS coordinate is used.
  waypoint_frame: robotac_start_body
  waypoints:
    # Takeoff is handled separately at z=1.0, then perform the payload route.
    - {x: 1.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 1.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: -1.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
    # After reaching the rear point, wait 2 s, open the 45 degree payload
    # servo, keep position for another 2 s, then fly back to the origin.
    - {x: -1.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0,
       payload_action: open, payload_settle: 2.0}
    - {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0, hold: 2.0}
  takeoff_height: 1.0
  position_tolerance: 0.25
  yaw_tolerance_deg: 12.0
  waypoint_timeout: 45.0
  mission_timeout: 600.0
  control_rate_hz: 20.0
  prestream_seconds: 5.0
  require_vision: true
  require_vision_output: true
  require_estimator_status: true
  # Local ENU flight does not require GPS/global position. PX4 must still
  # report a valid relative horizontal estimate and a vertical estimate.
  require_horizontal_relative: true
  require_vertical_estimate: true
  max_waypoint_xy: 20.0
  max_waypoint_z: 5.0
  local_pose_timeout: 0.30
  # Reject stale, replayed, or future-dated MAVROS local odometry.
  local_stamp_timeout: 0.50
  local_stamp_future_tolerance: 0.10
  # These must match MAVROS local_position in config/mavros/px4.yaml. The
  # controller uses this local ENU frame, never a GPS/global frame.
  strict_local_frames: true
  expected_local_parent: map
  expected_local_child: base_link
  # Reject an EKF/local-position reset or implausible pose jump rather than
  # continuing to send an old OFFBOARD target. Tune only from ground logs.
  max_local_position_speed: 6.0
  max_local_yaw_rate: 6.0
  state_timeout: 1.0
  extended_state_timeout: 1.0
  vision_timeout: 0.50
  vision_status_timeout: 0.50
  vision_output_timeout: 0.50
  vision_output_stamp_timeout: 0.30
  vision_output_stamp_future_tolerance: 0.10
  # Sunray Path A uses geometry_msgs/PoseStamped on /mavros/vision_pose/pose.
  vision_output_topic: /mavros/vision_pose/pose
  vision_output_type: pose
  vision_output_parent: odom
  # Verify that MAVROS's vision_pose plugin, not merely another monitor, has
  # subscribed to the bridge output before the start service accepts a mission.
  require_vision_output_consumer: true
  vision_output_consumer_node: /mavros
  # Active OFFBOARD control requires MAVROS's setpoint_raw plugin to subscribe
  # before /start is accepted. This confirms local setpoints have a consumer.
  setpoint_topic: /mavros/setpoint_raw/local
  require_setpoint_consumer: true
  setpoint_consumer_node: /mavros
  # During active control, re-check that MAVROS is still consuming both
  # vision-pose and setpoint_raw topics. A lost consumer immediately aborts
  # and closes the raw setpoint transmission gate.
  consumer_check_interval: 0.50
  # MAVROS sends the FAST-LIO source timestamp in VISION_POSITION_ESTIMATE.
  # Require a live, low-latency MAVLink time-sync stream before active control.
  require_timesync: true
  timesync_timeout: 1.0
  max_timesync_rtt_ms: 20.0
  estimator_timeout: 1.0
  # Time allowed for an explicitly requested OFFBOARD transition and arming.
  offboard_timeout: 15.0
  arming_timeout: 15.0
  takeoff_timeout: 45.0
  # Critical health, estimator, payload, MAVROS, and OFFBOARD faults stop raw
  # MAVROS setpoints. PX4 Offboard-loss failsafe must be validated before this
  # route is allowed to control the aircraft. An operator abort can choose hold
  # only while the operator is actively supervising the aircraft.
  critical_fault_action: release
  operator_abort_action: release
  abort_land_mode_timeout: 8.0
  auto_land_mode_timeout: 8.0
  landing_timeout: 60.0
  # This route is defined to land after returning to its start point. The launch
  # must therefore explicitly pass auto_land:=true before /start is accepted.
  require_auto_land: true
  # The flight node emits payload commands only with the explicit launch
  # argument enable_payload:=true. It first commands false (0 degrees), then
  # this route publishes true (45 degrees) only at the rear waypoint.
  payload_topic: /robotac_servo/control
  # The servo status is a serial-write acknowledgement, not a physical angle
  # measurement. Require it so a missing/failed controller blocks the mission.
  payload_status_topic: /robotac_servo/status
  payload_required_connection: true
  payload_require_ack: true
  payload_ack_timeout: 1.0
  payload_preflight_close: true
  payload_default_settle_seconds: 2.0
  land_mode: AUTO.LAND
  land_descent_rate: 0.30
  land_switch_height: 0.50
